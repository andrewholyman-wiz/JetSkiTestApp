apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/part-of: civitas
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civitas
  namespace: demo-app
  labels:
    app: civitas
    app.kubernetes.io/name: civitas
    app.kubernetes.io/part-of: civitas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civitas
  template:
    metadata:
      labels:
        app: civitas
        app.kubernetes.io/name: civitas
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: civitas
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __IMAGE_URI__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: basic-auth
              mountPath: /etc/nginx/auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: basic-auth
          secret:
            secretName: civitas-basic-auth
            defaultMode: 0440
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: civitas-pdb
  namespace: demo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: civitas
---
apiVersion: v1
kind: Service
metadata:
  name: civitas
  namespace: demo-app
  labels:
    app: civitas
    app.kubernetes.io/name: civitas
spec:
  type: LoadBalancer
  selector:
    app: civitas
  ports:
    - name: http
      port: 80
      targetPort: http
